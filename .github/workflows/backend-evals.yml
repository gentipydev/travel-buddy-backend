name: Backend Evals

# Runs Braintrust eval suites against the chat pipeline whenever a PR
# touches anything that could move Claude's behavior — prompts, tool
# schemas, the chat agent, the chat pipeline, or the LLM client. Pytest
# already covers shape regressions (see backend-ci.yml); this workflow
# covers behavioral regressions only.
#
# The job is skipped silently when `BRAINTRUST_API_KEY` is not set in
# repo secrets, so contributors without secret access can still ship
# unrelated PRs without a failed eval check. Pass/fail policy per scorer
# is owned by the Braintrust UI (Project Settings → Online Scoring):
# `itinerary_schema_valid` + `geo_boundary_adherence` are fail-on-
# regression; `refine_fidelity` + `persona_gate` are warn-only.
# `retrieval_hit_rate` + `retrieval_mrr` now run against a seeded pgvector
# service (see the seed step below) and produce real numbers — start them
# warn-only until a baseline is observed, then promote to fail-on-regression.
# `answer_faithfulness` (calibration + live, LLM-as-judge) stays warn-only
# while its baseline stabilizes.

on:
  pull_request:
    paths:
      - 'app/prompts/**'
      - 'app/tools/**'
      - 'app/agents/chat_agent.py'
      - 'app/domain/chat_pipeline.py'
      - 'app/llm/**'
      - 'app/evals/**'
      - 'evals/**'
      - 'requirements*.txt'
      - '.github/workflows/backend-evals.yml'

concurrency:
  group: backend-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip the whole job when Braintrust isn't configured — prevents
    # forked-PR builds from failing on missing secrets.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    # Ephemeral pgvector so the retrieval-quality and faithfulness-live suites
    # query a real (tiny, seeded) chunks corpus instead of a stub. The seed
    # step below applies the schema via SQLAlchemy create_all and inserts
    # evals/fixtures/eval_corpus.jsonl.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evaldb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-placeholder
      SUPABASE_SERVICE_KEY: test-placeholder
      # Points at the pgvector service above. The retrieval / faithfulness-live
      # tasks open their own session against this; the seed step bootstraps it.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/evaldb
      ALLOWED_ORIGINS: http://localhost:3000
      MAPBOX_ACCESS_TOKEN: test-placeholder
      LOG_LEVEL: WARNING
      LOG_FORMAT: text
      BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
      BRAINTRUST_ENABLED: 'true'
      BRAINTRUST_PROJECT: travel-buddy
    steps:
      - uses: actions/checkout@v4

      - name: Bail out if BRAINTRUST_API_KEY is not configured
        run: |
          if [ -z "$BRAINTRUST_API_KEY" ]; then
            echo "::notice::BRAINTRUST_API_KEY not set; skipping eval suite."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.skip != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        if: env.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Seed eval chunks corpus
        if: env.skip != 'true'
        # --bootstrap: CREATE EXTENSION vector + create_all on the fresh
        # service DB, then insert the eval corpus (embedded via Cohere). The
        # retrieval / faithfulness-live suites query these rows.
        run: python -m evals.seed_eval_db --bootstrap

      - name: Run Braintrust eval suites
        if: env.skip != 'true'
        # `braintrust eval` discovers Eval(...) calls in the target file
        # and runs them, posting results to the project. Exit code is
        # 0 even on score drops — fail-on-regression is enforced server-
        # side per scorer (configured in the Braintrust UI). A drop on a
        # fail-on-regression scorer will fail the PR check via Braintrust's
        # GitHub App integration, not this job's exit code.
        run: braintrust eval evals/runners/braintrust_run.py
