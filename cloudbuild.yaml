# Continuous deployment for travel-buddy-backend.
#
# Triggered on push to `main` (Cloud Build trigger "deploy-backend-main"): build
# the image from the Dockerfile, push it to Artifact Registry, and deploy a new
# Cloud Run revision pinning the runtime service account, env vars, and secrets.
#
# This MIRRORS scripts/deploy_cloudrun.sh — keep the two in sync. Why Cloud Run +
# Vertex (no GEMINI_API_KEY): see docs/deploy-cloudrun.md and the deploy script
# header. The runtime SA supplies Vertex auth via ADC; secrets come from Secret
# Manager (created once by scripts/setup_cloudrun_iam_secrets.sh).
substitutions:
  _REGION: europe-west2
  _SERVICE: travel-buddy-backend
  _RUNTIME_SA: gemini-vertex-422@travel-buddy-500309.iam.gserviceaccount.com
  # CORS origin(s) the web app is served from. Comma-separated.
  _ALLOWED_ORIGINS: "https://travel-buddy-web-2h4g.onrender.com,https://travel-buddy-mobile.onrender.com,http://localhost:3000"
  # Reuse the Artifact Registry repo that `gcloud run deploy --source` created.
  _IMAGE: europe-west2-docker.pkg.dev/travel-buddy-500309/cloud-run-source-deploy/travel-buddy-backend

steps:
  # 1. Build the image (tag with the commit SHA for traceability + latest).
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${SHORT_SHA}", "-t", "${_IMAGE}:latest", "."]

  # 2. Push both tags BEFORE deploy (the deploy step references the SHA tag).
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  # 3. Deploy the freshly built image, pinning runtime SA + env + secrets.
  #    ALLOWED_ORIGINS contains commas, so --set-env-vars uses gcloud's '^##^'
  #    custom delimiter (default delimiter is comma → would mis-split it).
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --set-env-vars=^##^GEMINI_USE_VERTEX=true##GOOGLE_CLOUD_PROJECT=$PROJECT_ID##GOOGLE_CLOUD_LOCATION=global##GOOGLE_PLACES_ENABLED=true##GOOGLE_DIRECTIONS_ENABLED=true##LOG_FORMAT=json##SENTRY_ENVIRONMENT=production##ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}
      - --set-secrets=SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,DATABASE_URL=DATABASE_URL:latest,COHERE_API_KEY=COHERE_API_KEY:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest
      - --cpu=1
      - --memory=512Mi
      - --concurrency=40
      - --timeout=600
      - --min-instances=0
      - --max-instances=4

# Build logs to Cloud Logging only — required when the build runs as a
# user-specified service account (no default logs bucket).
options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
